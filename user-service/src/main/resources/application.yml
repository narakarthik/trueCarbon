spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/truecarbon}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Mysql@123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: user_schema
    default-schema: user_schema

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:5a7134743777217a25432a462d4a614e645267556b58703273357638792f423f}
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

internal:
  api-key: ${INTERNAL_API_KEY:truecarbon-internal-secret-key}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
